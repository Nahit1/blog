# Sadece lokal geliştirme için. Canlıda Neon kullanılır.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: blog
      POSTGRES_DB: blog
    ports:
      - "5433:5432"
    volumes:
      - blog-db:/var/lib/postgresql/data

volumes:
  blog-db:
